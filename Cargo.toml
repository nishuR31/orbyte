[workspace]
resolver = "2"
members = ["crates/*", "cli"]
exclude = ["third_party/tsz"]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
diagnostics = { path = "crates/diagnostics" }
ast = { path = "crates/ast" }
lexer = { path = "crates/lexer" }
parser = { path = "crates/parser" }
semantic = { path = "crates/semantic" }
ir = { path = "crates/ir" }
ir-builder = { path = "crates/ir-builder" }
optimizer = { path = "crates/optimizer" }
runtime = { path = "crates/runtime" }
backend-cranelift = { path = "crates/backend-cranelift" }
compiler = { path = "crates/compiler" }
compat = { path = "crates/compat" }
typecheck = { path = "crates/typecheck" }

boa_engine = "0.22.0"
swc = { version = "80.0.1", default-features = false }
swc_common = "26.0.0"
swc_ecma_ast = "29.0.2"
swc_ecma_parser = "46.1.2"
swc_ecma_transforms_base = { version = "50.0.3", features = ["inline-helpers"] }
serde_json = "1"

cranelift-codegen = "0.112"
cranelift-frontend = "0.112"
cranelift-module = "0.112"
cranelift-jit = "0.112"
cranelift-native = "0.112"
cranelift-object = "0.112"
unicode-ident = "1"

# Keep debug builds responsive while optimising dependencies (Boa and SWC are
# the hot path for the compatibility runtime).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
