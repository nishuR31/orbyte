name: Engine CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Node.js is the independent oracle for the example `.expected` files and
      # for the randomised differential test (cli/tests/random_diff.rs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        shell: bash
        run: cargo check --workspace --all-targets
      - name: Test (includes the JIT, the interpreter and the Node differential tests)
        shell: bash
        run: cargo test --workspace
      - name: Set up MSVC linker (Windows AOT)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: AOT smoke test
        shell: bash
        run: |
          cargo build --release
          BIN="target/release/orb"
          OUT="orb-aot-smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="$BIN.exe"
            OUT="$OUT.exe"
          fi
          "$BIN" build --native examples/javascript/calculate.js -o "$OUT"
          result=$("./$OUT")
          test "$result" = "610"
          echo "AOT output: $result"

  lint:
    runs-on: ubuntu-latest
    # Advisory until the codebase has been through `cargo fmt --all` once and the
    # first clippy run is clean; then delete the two `continue-on-error` lines.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true
